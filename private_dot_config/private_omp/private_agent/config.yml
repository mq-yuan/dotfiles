symbolPreset: nerd
theme:
  dark: mahogany
setupVersion: 1

disabledProviders:
  - claude

retry:
  # Automatically switch to the role's fallback model when its primary
  # provider hits a rate limit, overload, quota exhaustion, or outage.
  modelFallback: true

  # Once the primary provider cooldown expires, later turns automatically
  # revert to the original model.
  fallbackRevertPolicy: cooldown-expiry

  fallbackChains:
    # ──────────────────────────────────────────
    # GPT-5.6 Sol high is the unified GPT fallback for K3 roles.
    # DeepSeek V4 Pro adds a second option for text-only roles.
    # ──────────────────────────────────────────
    default:
      - "openai-codex/gpt-5.6-sol:high"
      - "deepseek/deepseek-v4-pro:high"

    task:
      - "openai-codex/gpt-5.6-sol:high"
      - "deepseek/deepseek-v4-pro:high"

    # DeepSeek models currently accept text input only, so visual roles use
    # the single GPT-5.6 Sol high fallback.
    vision:
      - "openai-codex/gpt-5.6-sol:high"

    designer:
      - "openai-codex/gpt-5.6-sol:high"


    # OpenAI-backed reasoning roles fall back through Sol, then K3.
    plan:
      - "openai-codex/gpt-5.6-sol:high"
      - "kimi-code/k3"

    advisor:
      - "openai-codex/gpt-5.6-sol:high"
      - "kimi-code/k3"

    # ──────────────────────────────────────────
    # Sol high is the first independent fallback; Kimi HighSpeed
    # (the former primary) is the second.
    # ──────────────────────────────────────────
    smol:
      - "openai-codex/gpt-5.6-sol:high"
      - "kimi-code/kimi-for-coding-highspeed:medium"

    tiny:
      - "openai-codex/gpt-5.6-sol:high"
      - "kimi-code/kimi-for-coding-highspeed:minimal"

    commit:
      - "openai-codex/gpt-5.6-sol:high"
      - "kimi-code/kimi-for-coding-highspeed:low"

tools:
  # Prompt only for write operations; the tools listed under `approval`
  # below are pre-approved and never prompt.
  approvalMode: write
  approval:
    bash: allow
    task: allow
    read: allow
    hub: allow
    eval: allow

shellPath: /bin/bash
modelRoles:
  # ──────────────────────────────────────────
  # Kimi K3: primary coding roles
  # K3 currently takes no thinking-effort suffix.
  # ──────────────────────────────────────────
  default: "kimi-code/k3"
  task: "kimi-code/k3"
  vision: "kimi-code/k3"
  designer: "kimi-code/k3"

  # ──────────────────────────────────────────
  # DeepSeek V4 Flash: lightweight and background roles
  # Verified quality with very fast output; 1M context, low cost.
  # ──────────────────────────────────────────
  smol: "deepseek/deepseek-v4-flash:high"
  tiny: "deepseek/deepseek-v4-flash:low"
  commit: "deepseek/deepseek-v4-flash:low"

  # ──────────────────────────────────────────
  # DeepSeek V4 Pro: planning and independent review
  # Sol xhigh remains for the deepest reasoning role.
  # ──────────────────────────────────────────
  plan: "deepseek/deepseek-v4-pro:high"
  slow: "openai-codex/gpt-5.6-sol:xhigh"
  advisor: "deepseek/deepseek-v4-pro:high"

# Show the model's reasoning/thinking block expanded in the UI.
hideThinkingBlock: false
