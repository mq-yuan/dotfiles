#!/bin/sh
# Chezmoi modify script: enforce the btop settings that differ from defaults.
#
# btop rewrites ~/.config/btop/btop.conf with every option (and a version
# header) when it exits, so chezmoi owns only the keys listed below. Matching
# lines are replaced, missing keys are appended, and everything else is left to
# btop. Removing a key here stops managing it; it does not reset it.
exec awk '
BEGIN {
    n = 0
    m[++n] = "color_theme = \"HotPurpleTrafficLight\""
    m[++n] = "presets = \"proc:1:default,cpu:0:default,mem:0:default\""
    m[++n] = "vim_keys = true"
    m[++n] = "shown_boxes = \"proc cpu mem\""
    m[++n] = "proc_per_core = true"
    m[++n] = "proc_left = true"
    m[++n] = "cpu_graph_upper = \"total\""
    m[++n] = "cpu_graph_lower = \"gpu-totals\""
    m[++n] = "show_gpu_info = \"On\""
    m[++n] = "cpu_invert_lower = false"
    m[++n] = "clock_format = \"[/user] %H:%M\""
    m[++n] = "disks_filter = \"exclude=/boot\""
    m[++n] = "shown_gpus = \"nvidia amd intel\""
    for (i = 1; i <= n; i++) {
        key = m[i]
        sub(/ = .*/, "", key)
        line[key] = m[i]
        order[i] = key
    }
}
{
    key = $0
    if (sub(/[ \t]*=.*/, "", key) && (key in line)) {
        print line[key]
        seen[key] = 1
        next
    }
    print
}
END {
    for (i = 1; i <= n; i++)
        if (!(order[i] in seen))
            print line[order[i]]
}
'
